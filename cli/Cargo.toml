# rullama-cli — the agentic CLI (brand: rullama). Extracted from
# rullama-framework into its own repo. Standalone workspace: rullama-*
# deps resolve via path to a sibling ../rullama-framework checkout (flip to
# crates.io version pins when the harness is published).
[workspace]
resolver = "2"

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Brainwires/rullama-cli"
homepage = "https://github.com/Brainwires/rullama-cli"
authors = ["Brainwires"]

[package]
name = "rullama-cli"
version.workspace = true
edition.workspace = true
description = "An AI-powered agentic CLI tool for autonomous coding assistance"
license = "MIT"
authors = ["Brainwires Team"]
keywords = ["ai", "agent", "cli", "coding-assistant", "autonomous", "llm"]
repository = "https://github.com/Brainwires/rullama-cli"
homepage = "https://github.com/Brainwires/rullama-cli"
publish = false

[[bin]]
name = "rullama"
path = "src/main.rs"
doc = false

[dependencies]
# Async runtime
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
async-stream.workspace = true

# CLI framework
clap = { version = "4", features = ["derive", "env", "color"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"

# TUI framework
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
termimad = "0.34"

# TUI extension components (checkbox, button, input, dialogs)
# Uses local dev version — published 0.4.2 lacks CursorMode, ScrollMode, delete_word_forward, title()
ratatui-interact = { version = "0.5.2", features = ["clipboard"] }

# HTTP client
reqwest.workspace = true

# OpenSSL vendoring for cross-compilation
openssl = { version = "0.10", features = ["vendored"] }

# WebSocket
tokio-tungstenite.workspace = true

# Supabase
postgrest = "1.6"

# MCP Protocol
rmcp.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
toml.workspace = true

# File operations
walkdir.workspace = true
glob.workspace = true
ignore.workspace = true
diffy.workspace = true

# Git
git2.workspace = true

# Clipboard
arboard = "3.4"

# Compression
zstd.workspace = true
flate2.workspace = true

# Utilities
anyhow.workspace = true
thiserror.workspace = true
regex.workspace = true
chrono.workspace = true
dirs.workspace = true
lazy_static = "1.5"
lru.workspace = true
sha2.workspace = true
base64.workspace = true
uuid.workspace = true
gethostname.workspace = true

# Password/crypto
bcrypt = "0.15"
hex.workspace = true
subtle.workspace = true
rand.workspace = true
keyring.workspace = true
zeroize.workspace = true
chacha20poly1305.workspace = true

# SQLite
rusqlite.workspace = true

# Logging/tracing
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Vector database
lancedb.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true

# Performance
rayon = "1.10"

# Glob pattern matching
globset = "0.4"

# Document processing
zip = "2.2"

# Schema validation
schemars.workspace = true

# URL parsing
url.workspace = true

# HTTP types
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

# Web scraping
scraper = "0.24"
parking_lot = "0.12"
urlencoding.workspace = true

# Adaptive prompting
ndarray.workspace = true
linfa.workspace = true
linfa-clustering.workspace = true
bincode.workspace = true

# Rhai scripting engine
rhai = { version = "1.23", features = ["sync", "serde"] }

# ── Brainwires Framework facade ──
rullama = { path = "../rullama-framework/crates/rullama", features = ["full"] }

# ── Brainwires Framework crates (custom feature flags) ──
rullama-agent = { workspace = true }
rullama-mdap = { workspace = true }
rullama-skills = { workspace = true, features = ["registry"] }
rullama-seal = { workspace = true }
rullama-eval = { workspace = true }
rullama-inference = { workspace = true }
rullama-tool-runtime = { workspace = true, features = ["native", "orchestrator", "rag"] }
rullama-tool-builtins = { workspace = true, features = ["native", "interpreters", "rag"] }
rullama-knowledge = { workspace = true, features = ["alt-folder-name"] }
rullama-rag = { workspace = true, features = ["documents"] }
rullama-network = { workspace = true, features = ["auth-keyring"] }
rullama-provider.workspace = true
rullama-telemetry = { workspace = true, features = ["native"] }
rullama-storage = { workspace = true, features = ["native"] }
rullama-stores = { workspace = true, features = ["session", "task", "plan", "conversation", "memory", "lock", "image"] }
rullama-memory = { workspace = true }
rullama-core = { workspace = true, features = ["native"] }

petgraph = "0.8.3"
nix = { version = "0.30.1", features = ["term", "signal", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
tokio-test = "0.4"
mockito = "1.5"
assert_cmd = "2.0"
predicates = "3.1"
dotenvy = "0.15"
proptest = "1.5"

[features]
default = []
interpreter-javascript = []
interpreter-python = []
interpreter-all = ["interpreter-javascript", "interpreter-python"]
piston = []
bedrock = ["rullama-provider/bedrock"]
vertex-ai = ["rullama-provider/vertex-ai"]
llama-cpp-2 = ["rullama-provider/llama-cpp-2"]
full = ["interpreter-all", "llama-cpp-2", "bedrock", "vertex-ai"]

[build-dependencies]
chrono = "0.4"

[workspace.dependencies]
# Internal crates
rullama-core = { path = "../rullama-framework/crates/rullama-core", version = "0.12.0", default-features = false }
rullama-tool-runtime = { path = "../rullama-framework/crates/rullama-tool-runtime", version = "0.12.0", default-features = false }
rullama-tool-builtins = { path = "../rullama-framework/crates/rullama-tool-builtins", version = "0.12.0", default-features = false }
rullama-agent = { path = "../rullama-framework/crates/rullama-agent", version = "0.12.0", default-features = false }
rullama-storage = { path = "../rullama-framework/crates/rullama-storage", version = "0.12.0", default-features = false }
rullama-stores = { path = "../rullama-framework/crates/rullama-stores", version = "0.12.0", default-features = false }
rullama-memory = { path = "../rullama-framework/crates/rullama-memory", version = "0.12.0" }
rullama-mdap = { path = "../rullama-framework/crates/rullama-mdap", version = "0.12.0" }
rullama-skills = { path = "../rullama-framework/crates/rullama-skills", version = "0.12.0" }
rullama-seal = { path = "../rullama-framework/crates/rullama-seal", version = "0.12.0", default-features = false }
rullama-eval = { path = "../rullama-framework/crates/rullama-eval", version = "0.12.0" }
rullama-inference = { path = "../rullama-framework/crates/rullama-inference", version = "0.12.0", default-features = false }
rullama-mcp-client = { path = "../rullama-framework/crates/rullama-mcp-client", version = "0.12.0" }
rullama-permission = { path = "../rullama-framework/crates/rullama-permission", version = "0.12.0" }
rullama-sandbox = { path = "../rullama-framework/crates/rullama-sandbox", version = "0.12.0", default-features = false }
rullama-network = { path = "../rullama-framework/crates/rullama-network", version = "0.12.0" }
rullama-mcp-server = { path = "../rullama-framework/crates/rullama-mcp-server", version = "0.12.0" }
rullama-a2a = { path = "../rullama-framework/crates/rullama-a2a", version = "0.12.0", default-features = false }
rullama-provider = { path = "../rullama-framework/crates/rullama-provider", version = "0.12.0", default-features = false, features = ["native"] }
rullama-provider-speech = { path = "../rullama-framework/crates/rullama-provider-speech", version = "0.12.0", default-features = false }
rullama-call-policy = { path = "../rullama-framework/crates/rullama-call-policy", version = "0.12.0", default-features = false }
rullama-hardware = { path = "../rullama-framework/crates/rullama-hardware", version = "0.12.0" }
rullama-finetune = { path = "../rullama-framework/crates/rullama-finetune", version = "0.12.0" }
rullama-datasets = { path = "../rullama-framework/crates/rullama-datasets", version = "0.12.0", default-features = false }
# `rullama-finetune-local` and `rullama-training` were moved out of this
# framework into the `rullama` workspace (LoRA/QLoRA/DoRA + future
# training-from-scratch live there now). See CHANGELOG [Unreleased].
rullama-knowledge = { path = "../rullama-framework/crates/rullama-knowledge", version = "0.12.0", default-features = false }
rullama-rag = { path = "../rullama-framework/crates/rullama-rag", version = "0.12.0", default-features = false }
rullama-prompting = { path = "../rullama-framework/crates/rullama-prompting", version = "0.12.0", default-features = false }
rullama-reasoning = { path = "../rullama-framework/crates/rullama-reasoning", version = "0.12.0" }
rullama-telemetry  = { path = "../rullama-framework/crates/rullama-telemetry",  version = "0.12.0", default-features = false }
# `rullama-autonomy` and `rullama-proxy` live in `extras/`. They are
# workspace-only (publish = false) and no `crates/` member depends on them, so
# they intentionally do NOT appear in [workspace.dependencies] — that table is
# the API surface of the framework. See ADR-0004 (framework / extras boundary)
# and `cargo xtask lint-deps`.

# Tokenizer dependencies
tokenizers = "0.22"
tiktoken-rs = "0.9"

# `burn-*` was used by the deleted `rullama-finetune-local`; the local
# PEFT crate now lives in the `rullama` workspace, where Burn is pinned
# directly. No framework crate depends on Burn anymore.

# Home automation serial protocols
tokio-serial = "5.4"
# CRC calculations (Zigbee EZSP/ASH CRC-16-CCITT)
crc = "3"
# mDNS service discovery (Matter device/controller discovery)
mdns-sd = "0.12"

# Async runtime & utilities
tokio = { version = "1.43" }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

# Error handling
anyhow = "1"
thiserror = "2"

# Identifiers & time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.8"

# MCP protocol
rmcp = { version = "1.1", features = ["client", "server", "client-side-sse", "transport-child-process", "transport-io", "macros"] }

# MCP server support
schemars = "1.0"
tokio-util = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Vector database & columnar storage
lancedb = "0.27"
arrow = "57"
arrow-array = "57"
arrow-schema = "57"

# Embeddings
fastembed = "5.1"

# Caching
lru = "0.16"

# Semantic versioning
semver = { version = "1", features = ["serde"] }

# Hashing
sha2 = "0.10"

# SQLite
rusqlite = { version = "0.38", features = ["bundled"] }

# File operations
walkdir = "2.5"
diffy = "0.4"
glob = "0.3"

# Code search
regex = "1"
ignore = "0.4"

# URL encoding
urlencoding = "2"

# Filesystem paths
dirs = "6"

# Git
git2 = "0.20"

# Security
zeroize = { version = "1", features = ["derive"] }

# Config parsing
toml = "1.0"

# ML / Clustering
linfa = "0.7"
linfa-clustering = "0.7"
ndarray = "0.15"

# Bitflags
bitflags = "2"

# Binary encoding
bincode = { version = "2", features = ["serde"] }

# Crypto
chacha20poly1305 = "0.10"
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
subtle = "2.6"
p256    = { version = "0.13.2", features = ["ecdh", "ecdsa", "arithmetic"] }
ecdsa   = { version = "0.16.9", features = ["der", "signing", "verifying"] }
hmac    = "0.12.1"
hkdf    = "0.12.4"
pbkdf2  = { version = "0.12.2", features = ["hmac"] }
aes     = "0.8.4"
ccm     = { version = "0.5.0", features = ["std"] }
der     = { version = "0.8.0", features = ["alloc", "derive"] }
pkcs8   = { version = "0.10.2", features = ["alloc"] }

# Keyring (secure key storage)
keyring = "3"

# Concurrent maps
dashmap = "6"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Discord API
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "chrono"] }

# Telegram Bot API
teloxide = { version = "0.13", features = ["macros"] }

# URL parsing
url = "2.5"

# Hostname
gethostname = "1.0"

# Compression
flate2 = "1.0"
zstd = "0.13"

# Local LLM inference (optional)
llama-cpp-2 = "0.1"

# AWS SDK (Bedrock auth)
aws-sigv4 = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = "1"

# GCP auth (Vertex AI)
gcp_auth = "0.12"

# HTTP (hyper ecosystem)
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy"] }
http = "1.1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# gRPC
tonic = "0.13"
prost = "0.14"
prost-types = "0.14"

# Neo4j Bolt protocol
neo4rs = "0.9.0-rc.9"

# Token decoding (used by llama-cpp-2)
encoding_rs = "0.8"

# Async stream adapters
tokio-stream = "0.1"

# Postgres + pgvector (using tokio-postgres to avoid sqlx's libsqlite3-sys conflict)
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
pgvector = { version = "0.4.1", features = ["postgres"] }

# Testing
tempfile = "3"
proptest = "1"

# ── Build profiles ──────────────────────────────────────────────────────────
#
# `dev` and `test` profiles emit minimal debug info (file:line only). Full
# debug info on the knowledge/storage test binaries pulls in lancedb,
# datafusion, arrow, tantivy, tree-sitter-*, and image processing, and the
# linker OOMs on stock GitHub Actions runners (signal 7, ld bus error).
# Line tables keep panic stack traces readable without the binary-size
# explosion.
#
# Release builds keep the default (full debug). Override per-crate if a
# specific consumer needs richer debug info.
