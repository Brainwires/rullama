# rullama nginx config — replaces the stock conf.d/default.conf.
# Sits behind a TLS-terminating front (Cloudflare Tunnel, Caddy, nginx);
# the listener is plain HTTP on the loopback-bound host port.

# Cache-Control for the JS/HTML/WASM shell + `/version.json`. wasm-pack
# output isn't content-hashed, so we can't let Cloudflare/browser cache
# it across rebuilds. `version.json` is the runtime update-check probe
# — must always reflect the live deploy, so the same `no-store` policy
# applies. The model blob (.gguf) is allowed to cache.
map $uri $rullama_cache_ctrl {
    default                                   "";
    ~*\.(js|html|wasm|css|mjs|d\.ts|json)$    "no-store, no-cache, must-revalidate, max-age=0";
}

server {
    listen       8088 default_server;
    server_name  _;
    root         /app;

    # Don't leak the nginx version in error pages / Server header.
    server_tokens off;

    # Behind cloudflared the listener port (8088) isn't reachable publicly, so
    # `Location:` headers must stay relative — otherwise nginx would emit e.g.
    # `Location: http://rullama.com:8088/some/path/` and the
    # browser would hang trying to reach :8088 through Cloudflare.
    absolute_redirect off;
    port_in_redirect  off;

    # WebGPU + cross-origin-isolated headers on every response.
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header Cross-Origin-Resource-Policy "same-origin"   always;
    # add_header skips empty values (>=1.7.5), so the JS/HTML/WASM shell
    # gets no-cache and everything else stays cacheable.
    add_header Cache-Control                $rullama_cache_ctrl  always;

    # Pull in nginx's stock mime.types (covers .css, .js, .html, .svg, .png,
    # .ico, .woff2, fonts, etc.), then declare just the extensions the
    # default map doesn't know about. A bare `types {}` block at server
    # scope REPLACES the http-level map; including the stock file *inside*
    # the server keeps it intact while still letting us add extras.
    include /etc/nginx/mime.types;
    types {
        application/wasm           wasm;
        application/manifest+json  webmanifest;
        application/octet-stream   gguf bin;
    }

    # JSON index of models, regenerated at container start by entrypoint.sh.
    location = /api/models {
        alias /tmp/rullama/models.json;
        default_type application/json;
    }

    # Model blobs. The entrypoint creates symlinks at /tmp/rullama/blobs/<family>:<tag>
    # pointing into the RO bind mount, so nginx can `alias` to them and serve
    # Range requests natively (sendfile + http_range built in).
    #
    # The regex capture is matched against the URL-decoded URI, so a client
    # request for `/api/blob/gemma4%3Ae2b` resolves to the file `gemma4:e2b`.
    location ~ "^/api/blob/(?<model>[A-Za-z0-9._:+-]+)$" {
        alias /tmp/rullama/blobs/$model;
        default_type application/octet-stream;
        add_header   Accept-Ranges  bytes  always;
        # Re-assert isolation headers (location-level add_header clears inherited ones).
        add_header   Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header   Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header   Cross-Origin-Resource-Policy "same-origin"   always;
    }

    # BYOK cloud proxy → Cloudflare Worker. Generated at container start by
    # entrypoint.sh into the writable tmpfs (the root FS is read-only), driven
    # by the CLOUD_WORKER_HOST env var. When unset it emits a `return 503`
    # stub. As a `^~ /api/cloud/` prefix match it outranks the `/api/` 404
    # catch-all below regardless of include order. The browser hits the same
    # same-origin `/api/cloud/*` path it uses in dev — only the backend differs.
    include /tmp/rullama/cloud.conf;

    # /api/log + /api/bench-result are dev-time diagnostics from the worker
    # in `web` and the bench harness. In prod we don't want to fail
    # them loudly — the worker's fetch is `keepalive:true` + .catch(()=>{}),
    # but a 405/404 still shows up red in browser devtools. A 204 keeps the
    # client happy without persisting anything.
    location = /api/log           { return 204; }
    location = /api/bench-result  { return 204; }

    # Anything else under /api/ 404s rather than 405-ing.
    location /api/ {
        return 404;
    }

    # wasm-pack output lives at /app/pkg and is referenced by absolute path
    # (`/pkg/rullama.js`) by both the new and legacy PWAs.
    location ^~ /pkg/ {
        alias /app/pkg/;
        try_files $uri =404;
    }

    # New React PWA (built from `web/`). SPA fallback to
    # /index.html so the service worker's `navigateFallback` route works
    # through nginx, and any future client-side routing keeps working.
    location / {
        root /app/web;
        try_files $uri $uri/ /index.html;
        autoindex off;
    }
}
