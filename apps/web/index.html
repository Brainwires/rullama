<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />

    <!-- TEMPORARY recovery escape hatch. A stale service worker after a deploy
         keeps serving precached chunks that mismatch the fresh index.html and
         crash the app on boot before any in-app recovery runs. Open the app
         with a query param to force a clean slate:
           ?reset=1    → kill the service worker + all caches + local state,
                         KEEP the downloaded model (no 7 GB re-download)
           ?reset=all  → also remove the downloaded model
         Navigation is NetworkFirst, so this fresh HTML loads past the stale SW;
         this runs FIRST (before the app bundle), kills the SW, then reloads to a
         clean URL (param stripped, so it can't loop). Remove once the SW update
         flow is fixed. -->
    <script>
      (function () {
        try {
          var v = new URLSearchParams(location.search).get("reset");
          if (!v) return;
          window.__RULLAMA_RESET = true; // main.tsx halts on this if it runs first
          var keepModel = v !== "all";
          var clean = location.pathname;
          try { document.title = "Recovering…"; } catch (e) {}
          (async function () {
            // 1) Kill the service worker(s) — the usual culprit after an update.
            try {
              if ("serviceWorker" in navigator) {
                var regs = await navigator.serviceWorker.getRegistrations();
                for (var i = 0; i < regs.length; i++) { try { await regs[i].unregister(); } catch (e) {} }
              }
            } catch (e) {}
            // 2) Drop all Cache Storage (precached / stale bundles).
            try {
              if ("caches" in window) {
                var ks = await caches.keys();
                for (var j = 0; j < ks.length; j++) { try { await caches.delete(ks[j]); } catch (e) {} }
              }
            } catch (e) {}
            // 3) Local key/value state.
            try { localStorage.clear(); } catch (e) {}
            try { sessionStorage.clear(); } catch (e) {}
            // 4) OPFS state dirs — KEEP rullama-models unless a full wipe.
            try {
              if (navigator.storage && navigator.storage.getDirectory) {
                var root = await navigator.storage.getDirectory();
                var names = [];
                for await (var ent of root.entries()) { names.push(ent[0]); }
                for (var k = 0; k < names.length; k++) {
                  if (keepModel && names[k] === "rullama-models") continue;
                  try { await root.removeEntry(names[k], { recursive: true }); } catch (e) {}
                }
              }
            } catch (e) {}
            // Reload into the clean app (param stripped → no loop).
            location.replace(clean);
          })();
        } catch (e) {}
      })();
    </script>
    <!-- Fixed scale, no user zoom. iOS otherwise lets a double-tap or
         pinch zoom the PWA in ways that break the standalone layout. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Gemma 4 in your browser. Pure Rust → WebAssembly + WebGPU. No server." />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS-Safari "Add to Home Screen" needs the legacy apple-* meta
         tags to render properly as a standalone PWA. Chromium has
         deprecated `apple-mobile-web-app-capable` in favour of
         `mobile-web-app-capable`; include both so iOS and Chromium are
         happy and the deprecation warning stays out of devtools. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="rullama" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <title>rullama — Gemma 4 in the browser</title>

    <!-- Boot-watchdog + boot-splash styles. Inline so the splash renders on
         first paint and the recovery UI renders even when the hashed CSS
         bundle is unreachable (the exact failure mode the watchdog is for). -->
    <style>
        #boot-splash {
            position: fixed; inset: 0;
            display: flex;
            background: #0f1115; color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 2rem; box-sizing: border-box;
            align-items: center; justify-content: center;
            flex-direction: column; text-align: center;
            z-index: 99998;
            transition: opacity 200ms ease-out;
        }
        #boot-splash .icon {
            width: 128px; height: 128px;
            border-radius: 24px;
            margin-bottom: 1.25rem;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            animation: bpulse 2.4s ease-in-out infinite;
        }
        @keyframes bpulse {
            0%, 100% { opacity: 0.85; transform: scale(1.00); }
            50%      { opacity: 1.00; transform: scale(1.03); }
        }
        #boot-splash h1 { font-size: 1.05rem; margin: 0 0 0.25rem; font-weight: 600; }
        #boot-splash p { font-size: 0.85rem; color: #9ca3af; margin: 0; max-width: 24rem; line-height: 1.4; }
        /* Progress bar — hidden until window.__rullamaBootProgress is called.
         * Sits below the detail text. */
        #boot-splash-progress {
            display: none;
            margin-top: 1.4rem;
            width: 320px; max-width: 80vw;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        #boot-splash-progress-bar {
            position: absolute; inset: 0 auto 0 0;
            width: 0;
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            transition: width 200ms ease-out;
        }
        #boot-splash-progress[data-indeterminate="1"] #boot-splash-progress-bar {
            width: 40%;
            animation: bslide 1.6s ease-in-out infinite;
        }
        @keyframes bslide {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        #boot-splash-progress-detail {
            display: none;
            margin-top: 0.55rem;
            font-size: 0.72rem;
            color: #6b7280;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
        }

        #boot-recovery {
            position: fixed; inset: 0;
            display: none;
            background: #0f1115; color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 2rem; box-sizing: border-box;
            align-items: center; justify-content: center;
            flex-direction: column; text-align: center;
            z-index: 99999;
        }
        #boot-recovery h1 { font-size: 1.05rem; margin: 0 0 0.5rem; font-weight: 600; }
        #boot-recovery p { font-size: 0.85rem; color: #9ca3af; margin: 0 0 1.25rem; max-width: 22rem; line-height: 1.4; }
        #boot-recovery button {
            padding: 0.5rem 1.1rem; border-radius: 0.5rem; border: 1px solid #374151;
            background: #1f2937; color: #e5e7eb; font: inherit; cursor: pointer;
        }
        #boot-recovery button:active { background: #374151; }
        #boot-recovery .small { font-size: 0.75rem; color: #6b7280; margin-top: 0.75rem; }
    </style>
</head>
<body class="bg-background text-foreground antialiased">
    <div id="root"></div>

    <!-- Boot splash: visible on first paint so the user never sees a black
         screen during bundle download / SW boot. main.tsx can update the
         status text via window.__rullamaBootStatus(title, detail), and
         the App can push model-load progress via
         window.__rullamaBootProgress(percent, detail). It self-hides as
         soon as React mounts UNLESS we know a saved model is about to
         auto-load — in which case it stays visible through the load. -->
    <div id="boot-splash" role="status" aria-live="polite">
        <img class="icon" src="/icons/icon-512.png" alt="rullama" aria-hidden="true" />
        <h1 id="boot-splash-title">Loading rullama…</h1>
        <p id="boot-splash-detail">Starting up.</p>
        <div id="boot-splash-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="boot-splash-progress-bar"></div>
        </div>
        <p id="boot-splash-progress-detail"></p>
    </div>

    <!-- Boot-recovery UI: hidden until the watchdog gives up on mount.
         Sits in the static HTML so it doesn't depend on the bundle. -->
    <div id="boot-recovery" role="alert" aria-live="assertive">
        <h1>App failed to start</h1>
        <p id="boot-recovery-detail">
            The service worker may be holding a broken state from a previous
            update. Reset clears cached files + worker, then reloads.
        </p>
        <button id="boot-recovery-btn" type="button">Reset app data</button>
        <p class="small">If this keeps happening, reinstall the app.</p>
    </div>

    <!-- Inline boot watchdog + splash controller. If #root has no children
         after BOOT_TIMEOUT_MS, automatically try a soft reset (clear SW +
         caches, reload with a `?_reset=…&_attempt=1` sentinel). On the
         next boot, if the sentinel is present and React STILL hasn't
         mounted in time, escalate to the manual recovery UI — so we
         never loop, but we also try to self-heal once before bothering
         the user. Lives in the static HTML so it survives any bundle /
         chunk-load failure (the exact failure that the recovery is for). -->
    <script>
        (function () {
            var BOOT_TIMEOUT_MS = 8000;
            var splash = document.getElementById('boot-splash');
            var splashTitle  = document.getElementById('boot-splash-title');
            var splashDetail = document.getElementById('boot-splash-detail');
            var splashProgress       = document.getElementById('boot-splash-progress');
            var splashProgressBar    = document.getElementById('boot-splash-progress-bar');
            var splashProgressDetail = document.getElementById('boot-splash-progress-detail');
            var rec = document.getElementById('boot-recovery');
            var btn = document.getElementById('boot-recovery-btn');
            if (!splash || !rec || !btn) return;

            // **Auto-hold** the splash if localStorage says a model was
            // loaded last session — we want to keep the splash visible
            // through the auto-load progress instead of flashing the
            // welcome screen for a second and then the chat shell. The
            // ?_reset=… sentinel skips this (the user is recovering).
            try {
                var sp = new URLSearchParams(location.search);
                var resetMode = sp.has('_reset');
                if (!resetMode) {
                    var pending = window.localStorage.getItem('rullama:pendingLoadDigest');
                    var last    = window.localStorage.getItem('rullama:lastLoadedDigest');
                    var has = (pending && pending !== '""' && pending !== '') ||
                              (last && last !== '""' && last !== '');
                    if (has) {
                        splash.dataset.held = '1';
                        if (splashTitle)  splashTitle.textContent  = 'Loading model…';
                        if (splashDetail) splashDetail.textContent = 'Preparing weights from local cache.';
                        if (splashProgress) {
                            splashProgress.style.display = 'block';
                            splashProgress.setAttribute('data-indeterminate', '1');
                        }
                    }
                }
            } catch (e) { /* localStorage unavailable */ }

            // Expose a tiny API so the JS bundle (pwa.ts) can update the
            // splash text during SW boot/swap, instead of users staring
            // at "Starting up." while a 1.5 s update gate runs.
            window.__rullamaBootStatus = function (title, detail) {
                try {
                    if (title  !== undefined && splashTitle)  splashTitle.textContent  = String(title);
                    if (detail !== undefined && splashDetail) splashDetail.textContent = String(detail);
                } catch (e) { /* */ }
            };

            // Model-load progress. App.tsx pumps this with the
            // loadingPercent / loadingLabel pair while
            // `modelStatus === "loading"`. Passing percent < 0
            // (or null) renders an indeterminate stripe.
            window.__rullamaBootProgress = function (percent, detail) {
                if (!splash || splash.dataset.hidden === '1') return;
                splash.dataset.held = '1';
                if (splashProgress) splashProgress.style.display = 'block';
                if (typeof percent === 'number' && percent >= 0 && percent <= 100) {
                    if (splashProgress) splashProgress.removeAttribute('data-indeterminate');
                    if (splashProgressBar) splashProgressBar.style.width = percent.toFixed(1) + '%';
                    if (splashProgress) splashProgress.setAttribute('aria-valuenow', String(Math.round(percent)));
                } else {
                    if (splashProgress) splashProgress.setAttribute('data-indeterminate', '1');
                }
                if (detail !== undefined && splashProgressDetail) {
                    splashProgressDetail.style.display = 'block';
                    splashProgressDetail.textContent = String(detail);
                }
            };

            // Released by App.tsx when the model is ready (or errored).
            window.__rullamaBootRelease = function () {
                if (!splash) return;
                delete splash.dataset.held;
                hideSplash();
            };

            // Safety release: if we held the splash because of a saved
            // digest but no progress arrives within 5 seconds of React
            // mounting, the auto-load probably bailed (saved digest but
            // model not in OPFS). Release so the user sees the model
            // picker. Cancelled by the first __rullamaBootProgress call.
            var progressReceived = false;
            var heldSafetyTimer = null;
            function armHeldSafetyTimer() {
                if (splash.dataset.held !== '1') return;
                if (heldSafetyTimer) return;
                heldSafetyTimer = setTimeout(function () {
                    if (splash.dataset.held === '1' && !progressReceived) {
                        delete splash.dataset.held;
                        hideSplash();
                    }
                }, 5000);
            }
            var _origBootProgress = window.__rullamaBootProgress;
            window.__rullamaBootProgress = function (percent, detail) {
                progressReceived = true;
                if (heldSafetyTimer) { clearTimeout(heldSafetyTimer); heldSafetyTimer = null; }
                return _origBootProgress(percent, detail);
            };

            // Hide the splash. Fade out so the React tree doesn't pop in.
            function hideSplash() {
                if (!splash || splash.dataset.hidden === '1') return;
                splash.dataset.hidden = '1';
                splash.style.opacity = '0';
                setTimeout(function () {
                    if (splash) splash.style.display = 'none';
                }, 250);
            }

            // Has the previous boot already tried a soft auto-recovery?
            // The query-string sentinel survives the reload; we read it
            // here, then strip it so it doesn't pollute subsequent reloads
            // initiated by the React app itself.
            function alreadyAttemptedAutoRecovery() {
                try {
                    var sp = new URLSearchParams(location.search);
                    return sp.get('_attempt') === '1';
                } catch (e) { return false; }
            }
            var wasAutoRecoveryAttempt = alreadyAttemptedAutoRecovery();
            if (wasAutoRecoveryAttempt) {
                try {
                    var url = new URL(location.href);
                    url.searchParams.delete('_attempt');
                    url.searchParams.delete('_reset');
                    history.replaceState(null, '', url.toString());
                } catch (e) { /* */ }
            }

            // Soft auto-recovery: unregister SW + clear caches + reload
            // with the sentinel set. Same as the manual button but fires
            // automatically the first time a boot exceeds the watchdog.
            async function attemptAutoRecovery() {
                try {
                    if (splashTitle)  splashTitle.textContent  = 'Recovering…';
                    if (splashDetail) splashDetail.textContent = 'Clearing stale cache and reloading.';
                } catch (e) { /* */ }
                try {
                    if ('serviceWorker' in navigator) {
                        var regs = await navigator.serviceWorker.getRegistrations();
                        await Promise.all(regs.map(function (r) { return r.unregister(); }));
                    }
                } catch (e) { /* */ }
                try {
                    if ('caches' in window) {
                        var keys = await caches.keys();
                        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    }
                } catch (e) { /* */ }
                var u = location.pathname + '?_reset=' + Date.now() + '&_attempt=1';
                location.replace(u);
            }

            // Escalation: show the manual recovery UI. Used when the
            // auto-recovery attempt has already happened on the previous
            // boot and React still won't mount — at that point we're
            // looking at a stuck SharedWorker / OPFS lock that survives
            // unregister, and the user probably needs to fully close the
            // PWA (or in the worst case, reinstall).
            function showRecoveryUI() {
                if (splash) splash.style.display = 'none';
                if (rec)    rec.style.display    = 'flex';
                // If we got here, the auto-recovery already ran and failed
                // — give the user better guidance.
                var detail = document.getElementById('boot-recovery-detail');
                if (detail && wasAutoRecoveryAttempt) {
                    detail.textContent =
                        'Tried clearing the service worker once already and the app still won’t start. ' +
                        'Force-quit the app (swipe it away from the recents view) and reopen. ' +
                        'If that doesn’t help, reinstall the PWA.';
                }
            }

            var armed = true;
            var watchdog = setTimeout(function () {
                if (!armed) return;
                var root = document.getElementById('root');
                if (root && root.children.length > 0) return;  // mounted, false alarm
                if (wasAutoRecoveryAttempt) {
                    showRecoveryUI();
                } else {
                    attemptAutoRecovery();
                }
            }, BOOT_TIMEOUT_MS);

            // Disarm + hide splash as soon as the React tree appears —
            // UNLESS we're holding for a model auto-load. In that case
            // React will call __rullamaBootRelease() once the model is
            // ready (or errored).
            var mo = new MutationObserver(function () {
                var root = document.getElementById('root');
                if (root && root.children.length > 0) {
                    armed = false;
                    clearTimeout(watchdog);
                    mo.disconnect();
                    if (splash.dataset.held === '1') {
                        armHeldSafetyTimer();
                        return;
                    }
                    hideSplash();
                }
            });
            mo.observe(document.documentElement, { childList: true, subtree: true });

            // Exception-driven recovery. The stale-service-worker failure mode
            // is a chunk/module LOAD error — the fresh index.html references
            // asset hashes the old SW's precache can't serve — which crashes
            // boot long before BOOT_TIMEOUT_MS, so the timeout path never fires.
            // Catch those load errors and run the SAME recovery immediately,
            // reusing the once-then-escalate guard so we self-heal but never
            // loop. Only acts on script/stylesheet/module load failures while
            // the app is still UNMOUNTED — a post-mount error is a normal app
            // error, not a boot problem, and must not nuke the SW.
            var recovering = false;
            function recoverNow() {
                if (recovering || !armed) return;
                var root = document.getElementById('root');
                if (root && root.children.length > 0) return; // mounted → runtime error, ignore
                recovering = true;
                armed = false;
                clearTimeout(watchdog);
                if (wasAutoRecoveryAttempt) { showRecoveryUI(); } else { attemptAutoRecovery(); }
            }
            function looksLikeChunkError(msg) {
                return /dynamically imported module|module script|Loading chunk|importScripts|Failed to fetch/i.test(msg || '');
            }
            window.addEventListener('error', function (e) {
                // Resource-load failures fire on the element with no message and
                // don't bubble — hence capture. Restrict to JS/CSS/module assets
                // so a failed icon/img can't trigger a reset.
                var t = e && e.target;
                var isAsset = t && (
                    t.tagName === 'SCRIPT' ||
                    (t.tagName === 'LINK' && /stylesheet|modulepreload|preload/i.test(t.rel || ''))
                );
                if (isAsset || looksLikeChunkError(e && e.message)) recoverNow();
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                var r = e && e.reason;
                if (looksLikeChunkError(r && (r.message || r) + '')) recoverNow();
            });

            btn.addEventListener('click', function () {
                btn.disabled = true;
                btn.textContent = 'Resetting…';
                (async function () {
                    try {
                        if ('serviceWorker' in navigator) {
                            var regs = await navigator.serviceWorker.getRegistrations();
                            await Promise.all(regs.map(function (r) { return r.unregister(); }));
                        }
                    } catch (e) { /* */ }
                    try {
                        if ('caches' in window) {
                            var keys = await caches.keys();
                            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
                        }
                    } catch (e) { /* */ }
                    // Cache-bust the URL so the next load is a forced fetch
                    // against the origin, not a cached response.
                    var u = location.pathname + '?_reset=' + Date.now();
                    location.replace(u);
                })();
            });
        })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
