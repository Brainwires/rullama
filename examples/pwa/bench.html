<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rullama WebGPU bench</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚡</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; padding: 0; background: #0c0f12; color: #d9e0e6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.4; }
  #out { white-space: pre-wrap; padding: 14px; padding-bottom: 80px; }
  .status { padding: 14px; border-bottom: 1px solid #233; position: sticky; top: 0; background: #0c0f12; }
  .ok  { color: #6cc; } .err { color: #f88; } .warn { color: #fc6; }
</style>
</head>
<body>
<div class="status" id="status">init…</div>
<div id="out"></div>
<script>
const out = document.getElementById("out");
const status = document.getElementById("status");
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  out.appendChild(line);
  console.log(msg);
}
function setStatus(t, cls) { status.textContent = t; status.className = "status " + (cls || ""); }

// Results POST back to Mac via the dev server's /api/bench-result endpoint.
const RUN_ID = (Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8));
async function postResult(payload) {
  try {
    await fetch("/api/bench-result", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ run_id: RUN_ID, ...payload }),
    });
  } catch (e) { log("postResult failed: " + e, "err"); }
}

// Kernel WGSL pulled from the dev server — single source of truth shared
// with the Rust pipeline, no risk of drift.
async function fetchKernel(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`fetch ${path}: HTTP ${r.status}`);
  return await r.text();
}

async function buildPipeline(device, src, label) {
  const module = device.createShaderModule({ code: src });
  const info = await module.getCompilationInfo();
  for (const m of info.messages) {
    log(`[${label} ${m.type}] ${m.message}`, m.type === "error" ? "err" : "warn");
  }
  return device.createComputePipeline({
    layout: "auto",
    compute: { module, entryPoint: "main" },
  });
}

function makeUniform(device, data) {
  const buf = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(buf, 0, data);
  return buf;
}
function makeStorage(device, byteLen, init) {
  const buf = device.createBuffer({ size: byteLen, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  if (init) device.queue.writeBuffer(buf, 0, init);
  return buf;
}

async function timedDispatch(device, label, setup, dispatchFn, iters = 5) {
  // Warmup.
  for (let i = 0; i < 3; i++) {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    setup(pass); dispatchFn(pass);
    pass.end();
    device.queue.submit([enc.finish()]);
  }
  await device.queue.onSubmittedWorkDone();
  // Time.
  const t0 = performance.now();
  for (let i = 0; i < iters; i++) {
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass();
    setup(pass); dispatchFn(pass);
    pass.end();
    device.queue.submit([enc.finish()]);
  }
  await device.queue.onSubmittedWorkDone();
  return (performance.now() - t0) / iters;
}

async function main() {
  setStatus("checking environment…", "warn");
  const env = {
    ua: navigator.userAgent, href: location.href, origin: location.origin,
    protocol: location.protocol, isSecureContext: window.isSecureContext,
    crossOriginIsolated: window.crossOriginIsolated,
    has_navigator_gpu: typeof navigator.gpu !== "undefined",
  };
  log("env: " + JSON.stringify(env, null, 2));
  await postResult({ event: "env", env });

  if (!navigator.gpu) {
    setStatus("ERROR: navigator.gpu is undefined", "err");
    if (!window.isSecureContext) log("Page is NOT a secure context — WebGPU is gated on HTTPS/localhost.", "err");
    else log("Safari → Apps → Safari → Advanced → Feature Flags → WebGPU?", "err");
    await postResult({ event: "no_webgpu", env });
    return;
  }

  setStatus("requesting adapter…", "warn");
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) {
    setStatus("ERROR: no GPU adapter", "err");
    await postResult({ event: "no_adapter", env });
    return;
  }
  const wantF16 = adapter.features.has("shader-f16");
  const features = wantF16 ? ["shader-f16"] : [];
  const device = await adapter.requestDevice({
    requiredFeatures: features,
    requiredLimits: {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, 1 << 30),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, 1 << 30),
    },
  });

  const info = {
    vendor: adapter.info?.vendor || "", architecture: adapter.info?.architecture || "",
    device: adapter.info?.device || "", description: adapter.info?.description || "",
    has_f16: wantF16,
    limits: {
      maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
      maxComputeWorkgroupStorageSize: adapter.limits.maxComputeWorkgroupStorageSize,
      maxComputeInvocationsPerWorkgroup: adapter.limits.maxComputeInvocationsPerWorkgroup,
    },
    features: Array.from(adapter.features).sort(), ua: navigator.userAgent,
  };
  log("adapter: " + (info.vendor || "?") + " / " + (info.architecture || info.description || info.device || "?"));
  log("features: " + info.features.join(", "));
  log("limits.maxComputeWorkgroupStorageSize = " + info.limits.maxComputeWorkgroupStorageSize);
  log("has_f16 = " + wantF16);
  await postResult({ event: "adapter", info });

  // ---- Matmul bench ----
  setStatus("compiling matmul kernel…", "warn");
  const matmulSrc = await fetchKernel(wantF16
    ? "/src/kernels/wgsl/f16_matmul_batched_tiled_v3_f16lds.wgsl"
    : "/src/kernels/wgsl/f16_matmul_batched_tiled_v3.wgsl");
  const matmulPipe = await buildPipeline(device, matmulSrc,
    wantF16 ? "matmul-f16lds" : "matmul-f32lds");
  log("matmul pipeline ok (" + (wantF16 ? "f16-LDS" : "f32-LDS") + ")");

  setStatus("benching matmul…", "warn");
  const matmulShapes = [
    { label: "attn QKV  768x768  ",  k: 768,  n:  768, batch: 2304 },
    { label: "attn out  768x768  ",  k: 768,  n:  768, batch: 2304 },
    { label: "ffn up    768x3072 ",  k: 768,  n: 3072, batch: 2304 },
    { label: "ffn down  3072x768 ",  k: 3072, n:  768, batch: 2304 },
  ];
  for (const shape of matmulShapes) {
    const { label, k, n, batch } = shape;
    const w_pairs = Math.max(1, (k * n / 2) | 0);
    const wBuf = makeStorage(device, w_pairs * 4, new Uint32Array(w_pairs).fill(0x33333333));
    const xBuf = makeStorage(device, batch * k * 4, new Float32Array(batch * k).fill(0.01));
    const yBuf = makeStorage(device, batch * n * 4);
    const pBuf = makeUniform(device, new Uint32Array([k, n, batch, 0]));

    const bg = device.createBindGroup({
      layout: matmulPipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: pBuf } },
        { binding: 1, resource: { buffer: wBuf } },
        { binding: 2, resource: { buffer: xBuf } },
        { binding: 3, resource: { buffer: yBuf } },
      ],
    });
    const dispatchX = Math.ceil(n / 32);
    const dispatchY = Math.ceil(batch / 32);
    const perMs = await timedDispatch(device, label,
      (p) => { p.setPipeline(matmulPipe); p.setBindGroup(0, bg); },
      (p) => { p.dispatchWorkgroups(dispatchX, dispatchY, 1); });

    const flops = 2 * k * n * batch;
    const gflops = flops / (perMs / 1000) / 1e9;
    const line = `${label} k=${String(k).padStart(4)} n=${String(n).padStart(4)} batch=${String(batch).padStart(4)} | ${perMs.toFixed(2)} ms/iter   ${gflops.toFixed(1)} GFLOPS`;
    log(line, "ok");
    await postResult({ event: "matmul", shape, ms_per_iter: perMs, gflops });

    wBuf.destroy(); xBuf.destroy(); yBuf.destroy(); pBuf.destroy();
  }

  // ---- Attention bench ----
  // Same shapes the Rust matmul_bench uses for the vision tower:
  // n_patches=2304, n_heads=12, head_dim=64.
  if (wantF16) {
    setStatus("compiling HPD attention kernel…", "warn");
    let attnSrc;
    try {
      attnSrc = await fetchKernel("/src/kernels/wgsl/vision_attention_flash_hpd_f16.wgsl");
    } catch (e) {
      log("attn kernel fetch failed: " + e, "err");
      await postResult({ event: "done" });
      setStatus("done (matmul only) ✓", "ok");
      return;
    }
    const attnPipe = await buildPipeline(device, attnSrc, "attn-hpd-f16");
    log("attention pipeline ok (HPD f16, no subgroup)");

    setStatus("benching attention…", "warn");
    const n_patches = 2304, n_heads = 12, head_dim = 64;
    const qkv_len = n_patches * n_heads * head_dim;
    const qkv_bytes = qkv_len * 4;
    // Buffers already in HPD layout [n_heads, n_patches, head_dim].
    const qBuf = makeStorage(device, qkv_bytes, new Float32Array(qkv_len).fill(0.01));
    const kBuf = makeStorage(device, qkv_bytes, new Float32Array(qkv_len).fill(0.01));
    const vBuf = makeStorage(device, qkv_bytes, new Float32Array(qkv_len).fill(0.01));
    const oBuf = makeStorage(device, qkv_bytes);
    const pBuf = makeUniform(device, new Uint32Array([head_dim, n_heads, n_patches, 0]));

    const bg = device.createBindGroup({
      layout: attnPipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: pBuf } },
        { binding: 1, resource: { buffer: qBuf } },
        { binding: 2, resource: { buffer: kBuf } },
        { binding: 3, resource: { buffer: vBuf } },
        { binding: 4, resource: { buffer: oBuf } },
      ],
    });
    // Dispatch: (ceil(n_patches/Q_PER_WG=8), n_heads, 1)
    const dispatchX = Math.ceil(n_patches / 8);
    const dispatchY = n_heads;
    const perMs = await timedDispatch(device, "attn",
      (p) => { p.setPipeline(attnPipe); p.setBindGroup(0, bg); },
      (p) => { p.dispatchWorkgroups(dispatchX, dispatchY, 1); },
      3);
    log(`  vision_attention (HPD f16): ${perMs.toFixed(2)} ms/iter  (×16 layers ≈ ${(perMs * 16).toFixed(0)} ms)`, "ok");
    await postResult({ event: "attn", variant: "hpd_f16",
      n_patches, n_heads, head_dim, ms_per_iter: perMs, total_16_layers_ms: perMs * 16 });

    qBuf.destroy(); kBuf.destroy(); vBuf.destroy(); oBuf.destroy(); pBuf.destroy();
  } else {
    log("(attention bench skipped — adapter lacks shader-f16)", "warn");
  }

  setStatus("done ✓", "ok");
  log("");
  log("--- bench complete ---");
  await postResult({ event: "done" });
}

main().catch(e => {
  setStatus("FATAL", "err");
  log(String(e), "err");
  log(e.stack || "", "err");
  postResult({ event: "fatal", error: String(e), stack: e.stack || "" });
});
</script>
</body>
</html>
