[package]
name = "rullama"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Browser-PWA Gemma 4 inference engine: Rust + wgpu + WASM."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "29.0.3"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"
thiserror = "2.0.18"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures-channel = { version = "0.3.32", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
env_logger = "0.11.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
js-sys = "0.3.98"
web-sys = { version = "0.3.98", features = [
    "Navigator",
    "Window",
    "WorkerGlobalScope",
    "WorkerNavigator",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"

[features]
default = []
# Reserved: was used to feature-gate the CPU reference forward; that path is now
# always built since the GPU forward shares KvState/Weights with it. The flag is
# kept (no-op) so existing `cargo test --features cpu-reference` invocations
# keep working without a script bump.
cpu-reference = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
