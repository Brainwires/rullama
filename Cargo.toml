[workspace]
resolver = "3"
members = [
    "crates/rullama",
    "crates/rullama-finetune",
    "crates/rullama-training",
]
# The iOS bench tool is a separate cargo-target build (staticlib for an
# Xcode project) and intentionally NOT a workspace member — keeping it
# out lets `cargo build --workspace --target wasm32-unknown-unknown`
# succeed without trying to build the staticlib for wasm.
exclude = [
    "tools/ios-bench",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# --- shared with rullama (the wgpu inference engine) ---
wgpu = "29.0.3"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.7"
thiserror = "2.0.18"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
futures-channel = { version = "0.3.32", default-features = false, features = ["alloc"] }
async-trait = "0.1.89"

# native-only (cfg-gated in member crates)
pollster = "0.4.0"
env_logger = "0.11.10"

# wasm-only (cfg-gated in member crates)
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.98"
web-sys = "0.3.98"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
rsqlite-wasm = { git = "https://github.com/Brainwires/rsqlite-wasm", rev = "71b85b0b1232be32c15f58c1953bea83eb08b320" }

# --- shared with rullama-finetune (Burn-backed PEFT training, native-only) ---
# Burn individual crates to avoid the cubecl-cpu links conflict that the
# umbrella `burn` crate would otherwise pull in.
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.43" }
burn-core = { version = "0.20", default-features = false, features = ["std"] }
burn-nn = { version = "0.20", default-features = false, features = ["std"] }
burn-optim = { version = "0.20", default-features = false, features = ["std"] }
burn-autodiff = { version = "0.20", default-features = false, features = ["std"] }
burn-wgpu = { version = "0.20", default-features = false, features = ["std", "autotune"] }
burn-ndarray = { version = "0.20", default-features = false, features = ["std"] }
tokenizers = "0.22"
safetensors = "0.7"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
