[workspace]
resolver = "3"
members = [
    "xtask",
]
# Excluded from the workspace so `cargo build --workspace` stays clean:
#   - dev-server: native dev HTTP server (axum/tokio/notify); invoked by
#     xtask via `--manifest-path` rather than `-p`. It has its own deps and is
#     not part of the (now tiny) workspace.
#
# The inference engine moved out into the rullama-framework platform repo as
# rullama-engine + rullama-lora (its engine/ sub-workspace). This repo is the
# rullama app — the PWA in web/ plus the serve/proxy dev-server. See README.md
# and rullama-framework/docs/ARCHITECTURE-engine-harness.md.
exclude = [
    "dev-server",
]

[workspace.package]
edition      = "2024"
rust-version = "1.91"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/Brainwires/rullama"
homepage     = "https://github.com/Brainwires/rullama"
authors      = ["Brainwires <brainwires.net@gmail.com>"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

# Kept because xtask's `[lints] workspace = true` references it.
[workspace.lints.clippy]
arc_with_non_send_sync = "allow"
