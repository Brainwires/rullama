[workspace]
resolver = "3"
members = [
    "xtask",
]
# This repo holds three consumer apps — web/ (PWA), native/ (.NET/Avalonia
# desktop + mobile, with a rust-core C-ABI shim), cli/ (the agentic CLI) — plus
# the serve/proxy dev-server that hosts web/. The root workspace stays tiny
# (just xtask); everything that pulls the rullama-framework crates / wgpu is
# EXCLUDED so `cargo build --workspace` here stays fast and native-only:
#   - dev-server:        axum/tokio/notify HTTP server; run via --manifest-path.
#   - cli:               the agentic CLI — its OWN cargo workspace (own Cargo.lock),
#                        path-deps the sibling ../../rullama-framework crates.
#   - native/rust-core:  C-ABI cdylib over rullama-engine/rullama-lora; links wgpu.
# The inference engine + harness live in the sibling rullama-framework repo. See
# README.md and rullama-framework/docs/ARCHITECTURE-engine-harness.md.
exclude = [
    "services/dev-server",
    "apps/cli",
    "apps/native/rust-core",
]

[workspace.package]
edition      = "2024"
rust-version = "1.91"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/Brainwires/rullama"
homepage     = "https://github.com/Brainwires/rullama"
authors      = ["Brainwires <brainwires.net@gmail.com>"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

# Kept because xtask's `[lints] workspace = true` references it.
[workspace.lints.clippy]
arc_with_non_send_sync = "allow"
